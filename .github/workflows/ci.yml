name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # End-to-end smoke tests (Playwright). Separate job so a browser failure is
  # never confused with a type error, and so `verify` stays fast.
  #
  # These tests READ the live Supabase project. They write nothing (see the
  # data-story comment at the top of playwright.config.ts), but they do need the
  # public Supabase URL + anon key to render anything at all — so the job
  # skips itself, loudly, when those repository secrets are not configured,
  # rather than reporting a green run that tested an empty site.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Supabase credentials are available
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping e2e — NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY repository secrets are not set, so the app cannot render real pages."
          fi

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.creds.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        if: steps.creds.outputs.ready == 'true'
        env:
          # Public, RLS-protected keys — the same pair the browser receives.
          # No service-role key is used or needed by these tests.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ always() && steps.creds.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
