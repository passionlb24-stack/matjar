# Builds the Android app.
#
# Matjar is a hosted-hybrid Capacitor shell: the native app loads
# https://matjarlb.com and layers push, geolocation, camera, share and deep
# links on top. So this workflow does NOT build the website — there is no
# `next build` here on purpose. It packages the shell that opens it. A web
# change reaches the app the moment Vercel deploys it, with no new APK.
#
# There is no Java or Android SDK on the maintainer's machine, and the
# maintainer is not a developer. GitHub's ubuntu runner has both preinstalled,
# so this is the build machine.
#
# Run it from the Actions tab -> Android -> Run workflow.
#
#   debug   (default) an APK that installs directly on a phone by opening the
#           file. Signed with Android's throwaway debug key, so it is for
#           testing only and can never be uploaded to Google Play.
#   release an AAB for the Play Console. Needs the four secrets below; without
#           them the job stops with an explanation instead of failing obscurely.
#
# For a release build, add these under Settings -> Secrets and variables ->
# Actions. Generating the keystore is a one-time step documented in
# docs/ANDROID_RELEASE.md — it must be kept forever, because Google rejects an
# update signed with a different key.
#
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug = installable test APK, release = Play Store AAB"
        type: choice
        options: [debug, release]
        default: debug
  # A tag is the second way in, and the only one that needs nothing but git.
  # Push `apk-<anything>` and a debug APK builds:
  #     git tag apk-2026-08-22 && git push origin apk-2026-08-22
  # Useful when the Actions UI is not to hand, and it leaves a permanent
  # marker of exactly which commit an APK came from, which "Run workflow"
  # does not.
  push:
    tags: ["apk-*"]

# A tag push carries no inputs, so the choice has to fall back to something.
# Debug: a tag must never be able to spend the signing key by accident.
env:
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the release step needs more than read, and only on a tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Capacitor's CLI and the native plugin packages are needed for `cap
      # sync`; the site's own dependencies are not, but npm ci installs the
      # lockfile as a whole and a partial install would drift from it.
      - name: Install dependencies
        run: npm ci

      # Copies native-shell/ into the Android project and regenerates the
      # plugin wiring from capacitor.config.ts. Without this, a newly added
      # Capacitor plugin is in package.json but absent from the APK.
      - name: Sync Capacitor
        run: npx cap sync android

      # The version has to climb for every Play upload, and hand-editing
      # build.gradle is exactly the step a non-developer forgets. The run
      # number is monotonic per repository, so it can never go backwards.
      # versionName stays whatever build.gradle says — that is the number the
      # public sees, and it is a product decision, not a build one.
      - name: Stamp versionCode from the run number
        if: env.BUILD_TYPE == 'release'
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Check release signing secrets
        if: env.BUILD_TYPE == 'release'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::A release build needs the signing secrets."
            echo "ANDROID_KEYSTORE_BASE64 is not set on this repository."
            echo "See docs/ANDROID_RELEASE.md for how to create the keystore"
            echo "and add all four secrets. Until then, choose 'debug' — that"
            echo "APK installs on a phone and needs no secrets at all."
            exit 1
          fi

      - name: Decode keystore
        if: env.BUILD_TYPE == 'release'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/matjar.jks
          # Never let the key reach a log or an artifact.
          echo "android/app/matjar.jks" >> .git/info/exclude

      # The repository is developed on Windows, where git does not carry a
      # POSIX executable bit, so android/gradlew arrived on the runner as
      # non-executable and the first build ever attempted died with
      # "./gradlew: Permission denied" before Gradle was even reached. The mode
      # bit is now set in the index too; this line means a future Windows
      # checkout that loses it again cannot break the build.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release AAB
        if: env.BUILD_TYPE == 'release'
        working-directory: android
        env:
          MATJAR_KEYSTORE: matjar.jks
          MATJAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MATJAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MATJAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: matjar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # An Actions artifact is a zip behind a login: installing it means
      # downloading on a computer, unzipping, and moving the APK to a phone. A
      # release asset on a public repository is a plain URL — it opens on the
      # phone itself, and so does any link sent to a tester, with no GitHub
      # account at all.
      #
      # Debug builds only, and never a release AAB: a Play bundle is signed
      # with the upload key and belongs in the Play Console, not on a public
      # download page.
      #
      # Safe to publish. The APK is a shell that loads matjarlb.com; its only
      # bundled asset is a 4KB splash page, and the single configuration value
      # inside it is that public URL. No key, no token, nothing that is not
      # already served to every visitor of the website.
      - name: Publish the APK as a release
        if: env.BUILD_TYPE == 'debug' && startsWith(github.ref, 'refs/tags/apk-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "matjar-$TAG.apk"
          printf '%s\n' \
            "نسخة تجريبية للأندرويد. نزّل الملف وافتحه من التلفون." \
            "" \
            "Android will warn that this did not come from the Play Store. That is expected for any app installed this way, and is not about this file." \
            "" \
            "Test build, signed with Android's public debug key: it installs and runs, and it can never be uploaded to Google Play." \
            "" \
            "Commit $SHA" > notes.md
          gh release create "$TAG" "matjar-$TAG.apk" \
            --title "Matjar test app — $TAG" --notes-file notes.md

      - name: Upload AAB
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: matjar-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
